<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Unit Converter</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header-section">
            <h1>Unit Converter</h1>
            <input type="number" id="input-unit" placeholder="0">
            <button id="convert-btn">Convert</button>
        </div>

        <div class="results-section">
            <div class="card">
                <h2>Length (Meter/Feet)</h2>
                <p id="length-output">0 meters = 0.00 feet | 0 feet = 0.00 meters</p>
            </div>
            <div class="card">
                <h2>Volume (Liters/Gallons)</h2>
                <p id="volume-output">0 liters = 0.00 gallons | 0 gallons = 0.00 liters</p>
            </div>
            <div class="card">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p id="mass-output">0 kilos = 0.00 pounds | 0 pounds = 0.00 kilos</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
